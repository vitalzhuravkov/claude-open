<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Тест переключения режимов</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a66; --accent:#c96442; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1e1d; --fg:#f0eee6; --muted:#a3a19b; --card:#2a2927; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; padding:16px; }
  main { max-width:560px; margin:0 auto; }
  .row { background:var(--card); border-radius:10px; padding:12px 14px; margin:10px 0; }
  button { padding:8px 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  p.muted, span.muted { color:var(--muted); font-size:13px; }
  input { width:100%; box-sizing:border-box; padding:6px 8px; margin:6px 0; }
</style>
</head>
<body>
<main>
  <h2>Тест: переключает ли ссылка режим</h2>
  <p class="muted">Перед каждой кнопкой открой в Claude <b>противоположный</b> режим (для Chat-кнопок — Cowork, и наоборот). Запиши, куда попал.</p>

  <div class="row"><b>1.</b> <button data-seq="claude://claude.ai/new">Chat, без текста</button></div>
  <div class="row"><b>2.</b> <button data-seq="claude://cowork/new">Cowork, без текста</button></div>
  <div class="row"><b>3.</b> <button data-seq="claude://claude.ai/new|claude://claude.ai/new?q=TEST-3">Chat: пустой → с текстом</button></div>
  <div class="row"><b>4.</b> <button data-seq="claude://cowork/new|claude://cowork/new?q=TEST-4">Cowork: пустой → с текстом</button></div>
  <div class="row"><b>5.</b> Ссылка на любой существующий чат (скопируй из адреса чата на claude.ai):
    <input id="chatid" placeholder="https://claude.ai/chat/xxxxxxxx-....">
    <button id="b5">Открыть этот чат → новый чат с текстом</button>
  </div>
  <p class="muted" id="log"></p>
</main>
<script>
  var log = document.getElementById('log');
  function run(seq) {
    log.textContent = 'Шаг 1: ' + seq[0];
    location.href = seq[0];
    if (seq[1]) setTimeout(function () { log.textContent += ' → шаг 2: ' + seq[1]; location.href = seq[1]; }, 2000);
  }
  document.querySelectorAll('button[data-seq]').forEach(function (b) {
    b.onclick = function () { run(b.dataset.seq.split('|')); };
  });
  document.getElementById('b5').onclick = function () {
    var m = document.getElementById('chatid').value.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    if (!m) { log.textContent = 'Не нашёл ID чата в ссылке'; return; }
    run(['claude://claude.ai/chat/' + m[0], 'claude://claude.ai/new?q=TEST-5']);
  };
</script>
</body>
</html>
