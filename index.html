<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Открываю Claude…</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a66; --accent:#c96442; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1e1d; --fg:#f0eee6; --muted:#a3a19b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; }
  a.btn { display:inline-block; margin-top:12px; padding:10px 18px; border-radius:8px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:600; }
  p.muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Открываю Claude…</h1>
  <p id="msg" class="muted">Если ничего не произошло, нажми кнопку ниже.</p>
  <a id="go" class="btn" href="#" hidden>Открыть в Claude</a>
  <p class="muted">Эту вкладку можно закрыть.</p>
</main>
<script>
  // Параметры: id — ID страницы Notion (32 hex), mode — cowork | chat.
  // Принимаем только их, чтобы через ссылку нельзя было подставить произвольный промпт.
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || '').replace(/-/g, '').toLowerCase();
  var mode = params.get('mode') === 'chat' ? 'chat' : 'cowork';

  if (!/^[0-9a-f]{32}$/.test(id)) {
    document.getElementById('title').textContent = 'Нет ID задачи';
    document.getElementById('msg').textContent = 'Ожидаю ссылку вида …/?id=<ID страницы Notion>&mode=cowork|chat';
  } else {
    var prompt = 'Возьми задачу по скилу notion-ai-task: https://www.notion.so/' + id;
    var q = encodeURIComponent(prompt);
    var go = document.getElementById('go');
    if (mode === 'chat') {
      // claude://claude.ai/new в приложении не переключает в Chat (проверено 25.09.2026),
      // поэтому Deep Research открываем в веб-версии claude.ai — там новый обычный чат с Research.
      var web = 'https://claude.ai/new?q=' + q;
      go.href = web;
      go.hidden = false;
      document.getElementById('title').textContent = 'Открываю чат на claude.ai…';
      location.replace(web);
    } else {
      var url = 'claude://cowork/new?q=' + q;
      go.href = url;
      go.hidden = false;
      document.getElementById('title').textContent = 'Открываю Cowork…';
      location.href = url;
      // Chrome разрешает закрыть вкладку, открытую извне и без истории; в других браузерах ничего не произойдёт.
      setTimeout(function () { window.close(); }, 1500);
    }
  }
</script>
</body>
</html>
