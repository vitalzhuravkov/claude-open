<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Claude…</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a66; --accent:#c96442; --code-bg:#f0eee6; --border:#dedcd4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1e1d; --fg:#f0eee6; --muted:#a3a19b; --code-bg:#2b2a27; --border:#3d3c38; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  main { width:100%; max-width:480px; text-align:center; }
  a.btn { display:inline-block; margin-top:12px; padding:10px 18px; border-radius:8px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:600; }
  [hidden] { display:none !important; }
  p.muted { color:var(--muted); font-size:14px; }
  #fallback { margin-top:32px; padding-top:20px; border-top:1px solid var(--border); text-align:left; }
  #fallback p { margin:0 0 8px; }
  #cmd { display:block; margin:0; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
         background:var(--code-bg); color:var(--fg); font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
         white-space:pre-wrap; word-break:break-all; user-select:all; -webkit-user-select:all; cursor:text; }
  #copy { margin-top:10px; padding:8px 16px; border:1px solid var(--accent); border-radius:8px; background:transparent;
          color:var(--accent); font:inherit; font-weight:600; cursor:pointer; }
  #copy:hover { background:var(--accent); color:#fff; }
  #copy.done { border-color:#3f8f5a; background:#3f8f5a; color:#fff; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Claude…</h1>
  <p id="msg" class="muted">If nothing happens, click the button below.</p>
  <a id="go" class="btn" href="#" hidden>Open in Claude</a>
  <section id="fallback" hidden>
    <p class="muted">Claude didn't open? Copy this command and paste it into a new Claude chat:</p>
    <code id="cmd"></code>
    <button id="copy" type="button">Copy command</button>
  </section>
</main>
<script>
  // Opens a new Claude Cowork session prefilled with the ai-task skill (plugin claude-notion-ultimate-brain) for a Notion task.
  // Params: id — Notion page ID (32 hex, required); name — task name (optional, display only).
  // The ID is validated strictly; the name is flattened to one line and capped, and the skill
  // treats it as a label only (task facts always come from Notion).
  // Desktop: the deep link carries the prompt, so the page redirects and closes itself.
  // Phone: the deep link opens Claude without the prompt, so the page stays open with the command to copy.
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || '').replace(/-/g, '').toLowerCase();
  var name = (params.get('name') || '')
    .replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 200);

  function selectCommand() {
    var range = document.createRange();
    range.selectNodeContents(document.getElementById('cmd'));
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok ? Promise.resolve() : Promise.reject();
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  if (!/^[0-9a-f]{32}$/.test(id)) {
    document.getElementById('title').textContent = 'Missing task ID';
    document.getElementById('msg').textContent = 'Expected a link like …/?id=<Notion page ID>&name=<task name>';
  } else {
    var prompt = 'Run ai-task https://www.notion.so/' + id + (name ? ' ' + name : '');
    var url = 'claude://cowork/new?q=' + encodeURIComponent(prompt);
    var go = document.getElementById('go');
    go.href = url;
    go.hidden = false;

    // iPadOS Safari reports itself as a Mac, so a touch-capable "Macintosh" counts as mobile.
    var ua = navigator.userAgent;
    var mobile = /Android|iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (!mobile) {
      location.href = url;
      setTimeout(function () { window.close(); }, 1500);
    } else {
      var copyBtn = document.getElementById('copy');
      var resetTimer;
      document.getElementById('cmd').textContent = prompt;
      document.getElementById('fallback').hidden = false;
      copyBtn.addEventListener('click', function () {
        clearTimeout(resetTimer);
        copyText(prompt).then(function () {
          copyBtn.textContent = 'Copied ✓';
          copyBtn.classList.add('done');
        }, function () {
          selectCommand();
          copyBtn.textContent = 'Press ⌘C / Ctrl+C to copy';
        }).then(function () {
          resetTimer = setTimeout(function () {
            copyBtn.textContent = 'Copy command';
            copyBtn.classList.remove('done');
          }, 2500);
        });
      });

      location.href = url;
    }
  }
</script>
</body>
</html>
