<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Claude…</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a66; --accent:#c96442; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1e1d; --fg:#f0eee6; --muted:#a3a19b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; }
  a.btn { display:inline-block; margin-top:12px; padding:10px 18px; border-radius:8px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:600; }
  p.muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Claude…</h1>
  <p id="msg" class="muted">If nothing happens, click the button below.</p>
  <a id="go" class="btn" href="#" hidden>Open in Claude</a>
  <p class="muted">You can close this tab.</p>
</main>
<script>
  // Opens a new Claude Cowork session prefilled with the notion-ai-task skill for a Notion task.
  // Params: id — Notion page ID (32 hex, required); name — task name (optional, display only).
  // The ID is validated strictly; the name is flattened to one line and capped, and the skill
  // treats it as a label only (task facts always come from Notion).
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || '').replace(/-/g, '').toLowerCase();
  var name = (params.get('name') || '')
    .replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 200);

  if (!/^[0-9a-f]{32}$/.test(id)) {
    document.getElementById('title').textContent = 'Missing task ID';
    document.getElementById('msg').textContent = 'Expected a link like …/?id=<Notion page ID>&name=<task name>';
  } else {
    var prompt = 'Run notion-ai-task https://www.notion.so/' + id + (name ? ' ' + name : '');
    var url = 'claude://cowork/new?q=' + encodeURIComponent(prompt);
    var go = document.getElementById('go');
    go.href = url;
    go.hidden = false;
    location.href = url;
    setTimeout(function () { window.close(); }, 1500);
  }
</script>
</body>
</html>
